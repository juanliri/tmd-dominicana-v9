<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- Lighting and 3D Filters -->
    <filter id="chiselBevel_advisory" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="plinthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Metal Gradients -->
    <linearGradient id="titaniumFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="titaniumSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="titaniumTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Plinth Gradients -->
    <linearGradient id="plinthFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="8%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="90%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="plinthTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Accent Crystal Gradients -->
    <linearGradient id="crystalFront_advisory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="crystalSide_advisory" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#1A0205" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#090D16" />

  <!-- MAIN 3D ARCHITECTURAL MONUMENT -->
  <g transform="translate(160, 110)">
    
    <!-- 1. 3D PLINTH BASE -->
    <g filter="url(#plinthShadow)" transform="translate(0, 640)">
      <!-- Plinth Top Chamfer / Shelf -->
      <polygon points="40,0 840,0 810,45 70,45" fill="url(#plinthTop)" />
      
      <!-- Plinth Front Brushed Metal Block -->
      <polygon points="70,45 810,45 810,230 70,230" fill="url(#plinthFront)" />
      <!-- Left 3D Side -->
      <polygon points="40,0 70,45 70,230 40,195" fill="url(#titaniumSide)" />
      <!-- Right 3D Side -->
      <polygon points="840,0 810,45 810,230 840,195" fill="#1E293B" />

      <!-- Plinth Bottom Rim -->
      <rect x="70" y="224" width="740" height="6" fill="#1E293B" opacity="0.6" />

      <!-- 3D EMBOSSED "TODOBUILD" ON PLINTH -->
      <!-- Letter Shadow Depth -->
      <text x="440" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="6" fill="#0F172A" text-anchor="middle">
        TODOBUILD
      </text>
      <!-- Letter Top Specular -->
      <text x="440" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="6" fill="#FFFFFF" text-anchor="middle" opacity="0.4">
        TODOBUILD
      </text>
      <!-- Letter Primary Metal Face -->
      <text x="440" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="6" fill="url(#titaniumFront)" text-anchor="middle">
        TODOBUILD
      </text>

      <!-- Laser Etched Division Subtitle -->
      <text x="440" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="16" fill="#6EE7B7" text-anchor="middle">
        ADVISORY
      </text>
    </g>

    <!-- 2. 3D INTERLOCKING "TB" MONOGRAM SCULPTURE -->
    <g filter="url(#chiselBevel_advisory)">
      
      <!-- A. 3D EXTRUSION DEPTH (Side / Shadow Facets) -->
      <!-- T Pillar Left 3D Side -->
      <polygon points="210,190 260,190 260,650 210,650" fill="url(#titaniumSide)" />
      <!-- T Crossbar Top 3D Facet -->
      <polygon points="80,190 140,110 440,110 390,190" fill="url(#titaniumTop)" />
      <polygon points="440,110 520,110 480,190 390,190" fill="url(#titaniumTop)" />
      <!-- T Left Chamfer 3D -->
      <polygon points="80,190 140,110 120,140 60,220" fill="#334155" />

      <!-- B Upper Crystal Loop 3D Extrusion -->
      <path d="M 460,190 L 510,125 C 640,125 720,185 720,290 L 670,350 C 670,250 590,190 460,190 Z" fill="url(#crystalSide_advisory)" />
      <!-- B Lower Crystal Loop 3D Extrusion -->
      <path d="M 460,350 L 520,350 C 660,350 740,430 740,550 L 680,650 C 680,530 600,450 460,450 Z" fill="url(#crystalSide_advisory)" />

      <!-- B. FRONT FACES (Direct Architectural Illumination) -->
      <!-- T Stem (Titanium Front Face) -->
      <polygon points="260,190 380,190 380,650 260,650" fill="url(#titaniumFront)" />
      <!-- T Stem Chrome Edge Highlight -->
      <line x1="260" y1="190" x2="260" y2="650" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
      <line x1="380" y1="190" x2="380" y2="650" stroke="#0F172A" stroke-width="2" opacity="0.6" />

      <!-- T Horizontal Crossbar (Titanium Front Face) -->
      <polygon points="60,220 120,140 460,140 500,220 100,220" fill="url(#titaniumFront)" />
      <!-- T Crossbar Highlight Rim -->
      <polyline points="60,220 120,140 460,140 500,220" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />

      <!-- B Upper Crystal Loop (Front Face) -->
      <path d="M 380,190 L 510,190 C 600,190 650,230 650,320 C 650,400 590,440 510,440 L 380,440 Z" fill="url(#crystalFront_advisory)" />
      <!-- Upper Loop Inner Hole (Titanium Negative Space) -->
      <path d="M 430,240 L 490,240 C 535,240 565,265 565,320 C 565,365 535,390 490,390 L 430,390 Z" fill="#0F172A" opacity="0.6" />
      <!-- Upper Inner 3D Floor -->
      <polygon points="430,390 490,390 505,405 445,405" fill="url(#titaniumTop)" />

      <!-- B Lower Crystal Loop (Front Face) -->
      <path d="M 380,420 L 530,420 C 630,420 680,470 680,560 C 680,640 610,650 510,650 L 380,650 Z" fill="url(#crystalFront_advisory)" />
      <!-- Lower Loop Inner Hole -->
      <path d="M 430,470 L 510,470 C 560,470 590,500 590,560 C 590,610 550,620 490,620 L 430,620 Z" fill="#0F172A" opacity="0.6" />
      <!-- Lower Inner 3D Floor -->
      <polygon points="430,620 500,620 515,635 445,635" fill="url(#titaniumTop)" />

      <!-- Crystal Prism Reflection Highlights -->
      <path d="M 380,190 L 510,190 C 550,190 580,200 600,220 L 410,220 Z" fill="#FFFFFF" opacity="0.4" />
      <path d="M 380,420 L 530,420 C 570,420 610,435 630,460 L 410,460 Z" fill="#FFFFFF" opacity="0.35" />
    </g>
  </g>
</svg>